name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit + database tests (PGlite runs the real migrations)
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (migrations + seed)
        run: supabase start
      - name: Export Supabase env
        run: |
          supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
      - name: Bootstrap Super Admin
        run: pnpm create-super-admin
        env:
          SUPER_ADMIN_EMAIL: superadmin.e2e@gmail.com
          SUPER_ADMIN_PASSWORD: E2e-Bootstrap-Pass-2026!
      - run: pnpm --filter @dhulka/web exec playwright install --with-deps chromium
      - run: pnpm build && (pnpm --filter @dhulka/web start &) && npx wait-on http://localhost:3000/api/health
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: pnpm test:e2e
        env:
          E2E_SUPER_ADMIN_EMAIL: superadmin.e2e@gmail.com
          E2E_SUPER_ADMIN_PASSWORD: E2e-Bootstrap-Pass-2026!
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
